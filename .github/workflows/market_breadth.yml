name: Daily Market Breadth Update

on:
  # 9:30 AM IST = 4:00 AM UTC
  schedule:
    - cron: '0 4 * * 1-5'   # Monday to Friday only (market days)

  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests --quiet

      - name: Fetch market data
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN:   ${{ secrets.NETLIFY_TOKEN }}
        run: python fetch_market_data.py

      - name: Show output summary
        run: |
          echo "=== breadth_data.json ==="
          python -c "import json; d=json.load(open('breadth_data.json')); print(f'Days: {len(d[\"dates\"])}, Latest above: {d[\"above\"][-1]}/{d[\"total\"]}')"
          echo "=== vix_data.json ==="
          python -c "import json; d=json.load(open('vix_data.json')); print(f'Days: {len(d[\"dates\"])}, Latest pct: {d[\"percentile\"][-1]:.1f}th')"
